volumes:
  pgdata:

services:
  postgres:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGPORT: ${PGPORT:-5432}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${PGPORT:-5432}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-v3.14.0}

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?}

      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:?}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION:?}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?}

      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: 5000

      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow.invecorum.internal,mlflow.invecorum.internal:443,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "https://mlflow.invecorum.internal"

      SERVICE_URL_MLFLOW_5000: ${SERVICE_URL_MLFLOW_5000}
      SERVICE_FQDN_MLFLOW_5000: ${SERVICE_FQDN_MLFLOW_5000}

    command:
      - /bin/bash
      - -c
      - |
        set -e

        exec mlflow server \
          --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "$${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "$${MLFLOW_SERVER_ALLOWED_HOSTS}" \
          --cors-allowed-origins "$${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS}"

    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
